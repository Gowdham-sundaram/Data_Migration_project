[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-migration-helper"
version = "0.1.0"
description = "Local data migration preparation and reconciliation framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1.0",
  "pydantic>=2.7.0",
  "pytest>=8.0.0",
]

[project.scripts]
data-migration-helper = "dataguard.cli:main"
dataguard = "dataguard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
